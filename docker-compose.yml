services:
  database:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: investment_walkthrough
      MYSQL_USER: investment_user
      MYSQL_PASSWORD: investment_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  php:
    build:
      context: ./docker/php
    depends_on:
      - database
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      DATABASE_URL: mysql://investment_user:investment_password@database:3306/investment_walkthrough?serverVersion=9.7&charset=utf8mb4
    volumes:
      - ./:/var/www/html

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - '8080:80'
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
