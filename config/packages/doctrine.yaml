doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '9.7'
        charset: utf8mb4
    orm:
        auto_mapping: true
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
